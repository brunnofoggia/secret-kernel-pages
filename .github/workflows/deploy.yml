name: deploy

# Publishes dist/ to GitHub Pages on the custom domain in site.config.json.
#
# Deliberately manual: workflow_dispatch only. A deploy puts the page in front of
# people, and that stays a decision someone makes rather than a side effect of
# merging. To deploy on every push to main instead, add:
#
#   push:
#     branches: [main]
#
# to the triggers below.
#
# One-time setup outside this file:
#   - Settings > Pages > Source: GitHub Actions
#   - a DNS CNAME record for the subdomain pointing at <user>.github.io
#   - Settings > Pages > Enforce HTTPS, once the certificate is issued
#
# The domain itself is not configured here. It lives in site.config.json, which
# the build turns into dist/CNAME — without that file Pages silently drops the
# custom domain, so this workflow refuses to run when it is unset.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refuse to deploy without a configured domain
        run: |
          url=$(node -p "require('./site.config.json').url || ''")
          if [ -z "$url" ]; then
            echo "::error::site.config.json has no \"url\". Set the subdomain before deploying — without it the build emits no CNAME and Pages reverts to <user>.github.io."
            exit 1
          fi
          echo "deploying to $url"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run verify

      - name: Confirm the artifact carries the domain
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing"; exit 1; }
          echo "CNAME: $(cat dist/CNAME)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
